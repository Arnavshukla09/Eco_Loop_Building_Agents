version: "3.9"

# ── Honeywell Eco-Loop — Docker Compose ──────────────────────────────────────
# Starts all services in containers.
#
# Usage:
#   docker-compose up --build
#   docker-compose up -d          # detached mode
#   docker-compose logs -f eco-loop  # follow backend logs
#
# The Ollama container pulls the Qwen2.5 model on first startup.
# GPU acceleration requires the NVIDIA Container Toolkit.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Ollama LLM Server ──────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: eco-loop-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    # Uncomment the following for GPU support (requires NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Pull the Qwen2.5 model into Ollama ────────────────────────────────────
  ollama-pull:
    image: ollama/ollama:latest
    container_name: eco-loop-model-pull
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        sleep 5 &&
        ollama pull qwen2.5:7b &&
        echo 'Model qwen2.5:7b is ready.'
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  # ── Eco-Loop Backend (FastAPI + MCP + Simulation) ─────────────────────────
  eco-loop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eco-loop-backend
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      - SIMULATION_MODE=true
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=qwen2.5:7b
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - AGENT_INTERVAL_SECONDS=30
      - SPEEDUP_FACTOR=60
    volumes:
      - ./energyplus:/app/energyplus:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ollama_data:
    name: eco-loop-ollama-data
